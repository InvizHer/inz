<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvizHer | Home</title>

    <!--Linked Files-->
    <link href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../demo/style.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

</head>
<body>

    <header>
        <div class="header-items">
            <a href="#" class="title">
                <img src="../logo.png" alt="logo-image">
                <h1>InvizHer</h1>
            </a>

            <ul class="desktop-nav-list">
                <li><a href="#Home">Home</a></li>
                <li><a href="#posts">Posts</a></li>
                <li><a href="posts/?tag=notes">Notes</a></li>
                <li><a href="posts/?tag=webdev">Webdev</a></li>
            </ul>

            <div class="header-icons">
                <a class="support-btn" onclick="toggleHeart(this)">
                    <i class="fa-regular fa-heart"></i>
                </a>
                  

                <div class="toggle-btns">
                    <button class="openbtn" id="openBtn" onclick="toggleNav()"><i class="fa-solid fa-bars-staggered"></i></button>
                    <button class="closebtn hide" id="closeBtn" onclick="toggleNav()"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
        </div>
        <nav class="sidebar" id="mySidebar">
            <ul class="nav-list">
                <li><i class="fa-solid fa-house"></i><a href="#Home">Home</a></li>
                <li><i class="fa-solid fa-file-pen"></i><a href="posts">Posts</a></li>
                <li><i class="fa-solid fa-file-code"></i><a href="posts/?tag=notes">Notes</a></li>
                <li><i class="fa-brands fa-html5"></i><a href="posts/?tag=webdev">Webdev</a></li>
            </ul>
        </nav>
    </header>

    <!--======================== MAIN CONTENT ===================-->
    <main class="main-content container">
        <div class="main-header">
            <form class="search-section search-form">
                <input type="text" class="search-input" placeholder="Search ...">
                <button type="submit" class="search-button"><i class='bx bx-search-alt'></i></button>
            </form>
    
            <div class="categories">
                <select class="category-dropdown" aria-label="Select category">
                  <option value="">All Categories</option>
                  <option value="webdev">Web Development</option>
                  <option value="notes">Notes</option>
                  <option value="technology">Technology</option>
                  <option value="project">Projects</option>
                </select>
              </div>
        </div>

        <div class="articles-grid">
            <!-- Articles will be dynamically loaded here -->
        </div>

        <div class="pagination">
            <!-- Pagination will be dynamically loaded here -->
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container container">
            <a href="#" class="title">
                <img src="../logo.png" alt="logo-image">
                <h1>InvizHer</h1>
            </a>
            <div class="footer-social">
                <a href=""><i class="fa-brands fa-instagram"></i></a>
                <a href=""><i class="fa-brands fa-telegram"></i></a>
                <a href=""><i class="fa-brands fa-github"></i></a>
                <a href=""><i class="fa-brands fa-youtube"></i></a>
            </div>
            <div class="footer-links">
                <a href="#">About</a>
                <a href="#">Terms</a>
                <a href="#">Privacy</a>
            </div>
            <p class="copyright">© InvizHer-2024. All rigths reserved</p>
        </div>
    </footer>
    <script src="../demo/script.js"></script>
    <script src="script.js"></script>

    
</body>
</html>
