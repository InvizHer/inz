<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article</title>
    <link rel="stylesheet" href="/styles/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <a href="/">Home</a>
            <a href="/posts">Posts</a>
        </nav>
    </header>
    <main id="article-content"></main>
    <script src="/js/config.js"></script>
    <script src="/js/utils.js"></script>
    <script>
        async function loadArticle() {
            const slug = window.location.pathname.split('/').pop();
            try {
                const files = await fetchGitHubContent('articles');
                const markdownFiles = files.filter(file => file.name.endsWith('.md'));
                
                for (const file of markdownFiles) {
                    const content = await fetchRawContent(`articles/${file.name}`);
                    const metadata = extractMetadata(content);
                    if (sanitizeSlug(metadata.title) === slug) {
                        const articleContent = content.replace(/---\n[\s\S]*?\n---/, '').trim();
                        const html = marked.parse(articleContent);
                        
                        document.title = metadata.title;
                        document.getElementById('article-content').innerHTML = `
                            <article class="prose">
                                <h1>${metadata.title}</h1>
                                <div class="post-meta">
                                    <span>${new Date(metadata.date).toLocaleDateString()}</span>
                                </div>
                                ${html}
                            </article>
                        `;
                        break;
                    }
                }
            } catch (error) {
                console.error('Error loading article:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadArticle);
    </script>
</body>
</html>
